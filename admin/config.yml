##############################################################################
# Decap CMS Configuration — The Tea Bungalow · Galaha Estate
# Ref: bungalow-ledger.md §08
# Docs: https://decapcms.org/docs/configuration-options/
##############################################################################

# ── Backend: GitHub OAuth via Netlify Identity or GitHub Gateway ──────────
backend:
  name: github
  repo: Eranga27/teaestate-vD
  branch: feature/platform-integrations   # Change to 'main' when ready for production
  base_url: https://api.netlify.com        # OAuth provider; swap for Netlify Identity if preferred
  auth_endpoint: auth

# Allow local editing during development with `npx decap-server`
local_backend: true

# ── Media / Image Storage ─────────────────────────────────────────────────
media_folder: "The_Tea_Bungalow_vD_final_2026-09-08/vD/images/cms"
public_folder: "/images/cms"

# ── Site Settings ─────────────────────────────────────────────────────────
site_url: https://www.theteabungalow.com
display_url: https://www.theteabungalow.com
logo_url: https://www.theteabungalow.com/images/favicon.png

# ── Slug Configuration ───────────────────────────────────────────────────
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

##############################################################################
# CONTENT COLLECTIONS
##############################################################################

collections:

  # ── 01. EXPERIENCES ─────────────────────────────────────────────────────
  # Controls the cards on /experiences page (Pekoe trail guiding, tea tasting, etc.)
  - name: experiences
    label: "Experiences"
    label_singular: "Experience"
    folder: "The_Tea_Bungalow_vD_final_2026-09-08/vD/data/experiences"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: json
    format: json
    summary: "{{title}} — {{category}}"
    sortable_fields: ["title", "category", "featured"]
    fields:
      - label: "Experience Title"
        name: title
        widget: string
        hint: "e.g. Guided Pekoe Trail Walk"
      - label: "Category"
        name: category
        widget: select
        options:
          - { label: "Pekoe Trail", value: "pekoe-trail" }
          - { label: "Tea Estate", value: "tea-estate" }
          - { label: "Nature & Wildlife", value: "nature-wildlife" }
          - { label: "Colonial Heritage", value: "colonial-heritage" }
          - { label: "Dining", value: "dining" }
          - { label: "Wellness", value: "wellness" }
      - label: "Short Description"
        name: description
        widget: text
        hint: "2–3 sentences shown on the card. Keep under 160 characters."
      - label: "Duration"
        name: duration
        widget: string
        hint: "e.g. 4–6 hours, Half-day, Full-day"
      - label: "Availability"
        name: availability
        widget: select
        options:
          - { label: "Year-round", value: "year-round" }
          - { label: "Seasonal (Oct–Apr)", value: "seasonal-oct-apr" }
          - { label: "On Request", value: "on-request" }
      - label: "Featured on Homepage?"
        name: featured
        widget: boolean
        default: false
      - label: "Icon (Emoji)"
        name: icon
        widget: string
        hint: "Single emoji used in the card header, e.g. 🍃"
        required: false
      - label: "Card Image"
        name: image
        widget: image
        required: false
        hint: "Landscape, min 1200×700px, WebP preferred"

  # ── 02. PACKAGES & OFFERS ────────────────────────────────────────────────
  # Controls the package listing on /packages (pricing, inclusions, descriptions)
  - name: packages
    label: "Packages & Offers"
    label_singular: "Package"
    folder: "The_Tea_Bungalow_vD_final_2026-09-08/vD/data/packages"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: json
    format: json
    summary: "{{name}} — {{nights}} Night(s) · {{rate}}"
    sortable_fields: ["name", "nights", "active"]
    fields:
      - label: "Package Name"
        name: name
        widget: string
        hint: "e.g. The Slow Week, Tea Country Escape"
      - label: "Tagline"
        name: tagline
        widget: string
        hint: "One-line hook shown under the package name"
      - label: "Number of Nights"
        name: nights
        widget: number
        value_type: int
        min: 1
        max: 14
      - label: "Category"
        name: category
        widget: select
        options:
          - { label: "Pekoe Trail / Hiking", value: "pekoe-trail" }
          - { label: "Romantic / Couples", value: "romantic" }
          - { label: "Family", value: "family" }
          - { label: "Wellness", value: "wellness" }
          - { label: "Group / Buyout", value: "group" }
          - { label: "Dining / Day Experience", value: "dining" }
      - label: "Featured / Gold Card?"
        name: featured
        widget: boolean
        default: false
        hint: "Enables the gold-top highlight card style"
      - label: "Popular Badge Label"
        name: badge
        widget: string
        required: false
        hint: "e.g. ★ Most Booked — leave blank for none"
      - label: "Rate Display"
        name: rate
        widget: string
        hint: "e.g. From $185 per couple / Price on request"
      - label: "Rate Period"
        name: rate_period
        widget: string
        hint: "e.g. / couple, / night, / group"
        required: false
      - label: "Package Inclusions"
        name: inclusions
        widget: list
        label_singular: "Inclusion"
        hint: "Each line will appear as a bullet in the includes list"
        field:
          label: Inclusion
          name: inclusion
          widget: string
      - label: "Active / Visible?"
        name: active
        widget: boolean
        default: true
        hint: "Uncheck to hide this package without deleting it"

  # ── 03. ESTATE ANNOUNCEMENTS ─────────────────────────────────────────────
  # Seasonal alerts, trail conditions, dining specials — displayed as a banner
  - name: estate_announcements
    label: "Estate Announcements"
    label_singular: "Announcement"
    folder: "The_Tea_Bungalow_vD_final_2026-09-08/vD/data/announcements"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: json
    format: json
    summary: "{{title}} [{{type}}] — {{date}}"
    sortable_fields: ["date", "type", "active"]
    fields:
      - label: "Announcement Title"
        name: title
        widget: string
        hint: "e.g. Mist Trail Open · November–March Season"
      - label: "Type"
        name: type
        widget: select
        options:
          - { label: "Trail Condition", value: "trail" }
          - { label: "Seasonal Weather", value: "weather" }
          - { label: "Dining Highlight", value: "dining" }
          - { label: "Estate Notice", value: "notice" }
          - { label: "Special Offer", value: "offer" }
      - label: "Body"
        name: body
        widget: text
        hint: "1–3 sentences shown to guests. Plain text only."
      - label: "Date"
        name: date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "DD MMM YYYY"
        time_format: false
      - label: "Active / Pinned?"
        name: active
        widget: boolean
        default: true
      - label: "Expiry Date (optional)"
        name: expiry
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "DD MMM YYYY"
        time_format: false
        required: false
        hint: "Announcement will auto-hide after this date (requires build pipeline logic)"

  # ── 04. CHAMBERS & SUITE NOTES ───────────────────────────────────────────
  # Rate notes, seasonal minimum stay, special conditions per chamber
  - name: chambers
    label: "Chambers"
    label_singular: "Chamber"
    folder: "The_Tea_Bungalow_vD_final_2026-09-08/vD/data/chambers"
    create: false     # Rooms are fixed; only edit existing entries
    delete: false
    extension: json
    format: json
    summary: "{{name}} — {{rate_display}}"
    fields:
      - label: "Chamber Name"
        name: name
        widget: string
      - label: "Rate Display"
        name: rate_display
        widget: string
        hint: "Shown on the card, e.g. From $185/night · Price on request"
      - label: "Minimum Stay (nights)"
        name: min_stay
        widget: number
        value_type: int
        min: 1
        max: 7
        default: 1
      - label: "Seasonal Note"
        name: seasonal_note
        widget: text
        required: false
        hint: "Optional note shown in small text below rate, e.g. 3-night minimum during peak season (Dec–Jan)"
      - label: "Availability Note"
        name: availability_note
        widget: string
        required: false
        hint: "e.g. Closed for renovation until April 2027"
      - label: "Visible on Chambers Page?"
        name: active
        widget: boolean
        default: true

  # ── 05. GALLERY CAPTIONS ────────────────────────────────────────────────
  # Alt text and captions for /gallery images — SEO + accessibility
  - name: gallery
    label: "Gallery Captions"
    label_singular: "Gallery Image"
    folder: "The_Tea_Bungalow_vD_final_2026-09-08/vD/data/gallery"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: json
    format: json
    summary: "{{caption}} ({{category}})"
    fields:
      - label: "Image File"
        name: image
        widget: image
        hint: "Upload image — WebP or JPG, min 1200px wide"
      - label: "Caption"
        name: caption
        widget: string
        hint: "Descriptive caption displayed below image in gallery"
      - label: "Alt Text"
        name: alt
        widget: string
        hint: "Screen-reader description for accessibility and SEO"
      - label: "Category"
        name: category
        widget: select
        options:
          - { label: "Estate & Grounds", value: "estate" }
          - { label: "Chambers & Interiors", value: "chambers" }
          - { label: "Pekoe Trail", value: "pekoe-trail" }
          - { label: "Experiences", value: "experiences" }
          - { label: "Dining", value: "dining" }
          - { label: "Views & Landscape", value: "landscape" }
      - label: "Featured in Slideshow?"
        name: featured
        widget: boolean
        default: false
      - label: "Sort Order"
        name: sort_order
        widget: number
        value_type: int
        min: 1
        required: false
        hint: "Lower numbers appear first. Leave blank for auto."
