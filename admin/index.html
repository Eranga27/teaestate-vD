<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estate CMS · The Tea Bungalow</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="../images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

  <style>
    /* ══════════════════════════════════════════════
       GLOBAL
    ══════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green:      #1E4D2B;
      --green-deep: #07130E;
      --green-mid:  #0f2e1c;
      --gold:       #C7A85E;
      --gold-light: #dfc080;
      --cream:      #F5F1E9;
      --ink:        #1a1510;
    }
    body { font-family: 'EB Garamond', Georgia, serif; background: var(--green-deep); }

    /* ══════════════════════════════════════════════
       LOGIN SCREEN
    ══════════════════════════════════════════════ */
    #tb-cms-login {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 40%, #0e2b15 0%, #07130E 60%, #040c06 100%);
      z-index: 999999;
      padding: 24px;
    }

    /* Crest */
    .tb-login-crest { margin-bottom: 20px; animation: crestGlow 2.2s ease-in-out infinite alternate; }
    @keyframes crestGlow {
      0%   { filter: drop-shadow(0 0 6px rgba(199,168,94,0.25)); transform: scale(0.97); }
      100% { filter: drop-shadow(0 0 20px rgba(199,168,94,0.55)); transform: scale(1.02); }
    }

    .tb-login-estate-tag {
      font-family: 'Cinzel', serif;
      font-size: 9px; letter-spacing: 0.28em;
      color: rgba(199,168,94,0.65); text-transform: uppercase;
      margin-bottom: 6px;
    }
    .tb-login-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(17px, 2.5vw, 22px);
      font-weight: 500; letter-spacing: 0.16em;
      color: var(--cream); text-transform: uppercase;
      text-align: center; margin-bottom: 4px;
    }
    .tb-login-sub {
      font-family: 'EB Garamond', serif;
      font-size: 15px; font-style: italic;
      color: rgba(245,241,233,0.5); margin-bottom: 32px;
    }

    /* Card */
    .tb-login-card {
      width: min(92vw, 400px);
      background: rgba(15, 46, 28, 0.7);
      border: 1px solid rgba(199,168,94,0.3);
      border-radius: 12px;
      padding: 32px 28px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 24px 60px rgba(0,0,0,0.55);
    }

    .tb-login-label {
      font-family: 'Cinzel', serif;
      font-size: 9px; letter-spacing: 0.2em;
      color: var(--gold); text-transform: uppercase;
      display: block; margin-bottom: 7px;
    }
    .tb-login-input {
      width: 100%;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(199,168,94,0.25);
      border-radius: 6px;
      padding: 12px 14px;
      font-family: 'EB Garamond', serif;
      font-size: 15px; color: var(--cream);
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
      margin-bottom: 18px;
    }
    .tb-login-input:focus {
      border-color: rgba(199,168,94,0.65);
      box-shadow: 0 0 0 3px rgba(199,168,94,0.12);
    }
    .tb-login-input::placeholder { color: rgba(245,241,233,0.3); }

    .tb-login-btn {
      width: 100%;
      background: var(--gold);
      color: var(--ink);
      font-family: 'Cinzel', serif;
      font-size: 11px; letter-spacing: 0.18em;
      text-transform: uppercase; font-weight: 600;
      padding: 14px;
      border: none; border-radius: 6px;
      cursor: pointer;
      transition: background 0.25s, transform 0.2s, box-shadow 0.25s;
      margin-top: 4px;
    }
    .tb-login-btn:hover {
      background: var(--gold-light);
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(199,168,94,0.25);
    }
    .tb-login-btn:active { transform: translateY(0); }

    .tb-login-error {
      font-family: 'EB Garamond', serif;
      font-size: 14px; color: #e06c6c;
      text-align: center; margin-top: 14px;
      min-height: 20px;
      opacity: 0; transition: opacity 0.3s;
    }
    .tb-login-error.visible { opacity: 1; }

    .tb-login-rule {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(199,168,94,0.3), transparent);
      margin: 22px 0 0;
    }
    .tb-login-footer {
      font-family: 'EB Garamond', serif;
      font-size: 12px; color: rgba(245,241,233,0.35);
      text-align: center; margin-top: 10px;
    }

    /* ══════════════════════════════════════════════
       BRAND BAR (shown once logged in, above CMS)
    ══════════════════════════════════════════════ */
    #cms-brand-bar {
      display: none;          /* hidden until login passes */
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 50px;
      background: #07130E;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100000;
      border-bottom: 1px solid rgba(199,168,94,0.3);
    }
    #cms-brand-bar.visible { display: flex; }
    #cms-brand-bar .brand-left { display: flex; align-items: center; gap: 10px; }
    #cms-brand-bar .brand-title {
      font-family: 'Cinzel', serif; font-size: 10.5px;
      letter-spacing: 0.22em; color: var(--gold); text-transform: uppercase;
    }
    #cms-brand-bar .brand-sep { width: 1px; height: 14px; background: rgba(199,168,94,0.3); }
    #cms-brand-bar .brand-sub {
      font-family: 'Cinzel', serif; font-size: 8.5px;
      letter-spacing: 0.18em; color: rgba(199,168,94,0.55); text-transform: uppercase;
    }
    #cms-brand-bar .brand-logout {
      font-family: 'Cinzel', serif; font-size: 9px;
      letter-spacing: 0.16em; color: rgba(199,168,94,0.6);
      text-transform: uppercase; cursor: pointer;
      background: none; border: 1px solid rgba(199,168,94,0.3);
      border-radius: 4px; padding: 5px 12px;
      transition: all 0.25s;
    }
    #cms-brand-bar .brand-logout:hover {
      color: var(--gold); border-color: var(--gold);
    }

    /* Push CMS content below brand bar */
    body > div:not(#cms-brand-bar):not(#tb-cms-login) { margin-top: 50px; }
    #nc-root { margin-top: 50px !important; }
  </style>
</head>
<body>

  <!-- ── Estate Brand Bar (shown after login) ── -->
  <div id="cms-brand-bar">
    <div class="brand-left">
      <svg width="20" height="20" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <circle cx="24" cy="24" r="22" stroke="#C7A85E" stroke-opacity="0.5" stroke-width="1"/>
        <path d="M24 9C24 9 20.5 16.5 17.5 19.5C14.5 22.5 11.5 24.5 11.5 28.5C11.5 34.5 16.5 37.5 24 37.5C31.5 37.5 36.5 34.5 36.5 28.5C36.5 24.5 33.5 22.5 30.5 19.5C27.5 16.5 24 9 24 9Z" stroke="#C7A85E" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M24 13V33.5M24 21.5L19 24.5M24 25.5L29 28.5" stroke="#C7A85E" stroke-width="1" stroke-opacity="0.75" stroke-linecap="round"/>
      </svg>
      <div class="brand-title">The Tea Bungalow</div>
      <div class="brand-sep"></div>
      <div class="brand-sub">Estate Content Manager</div>
    </div>
    <button class="brand-logout" id="cmsLogoutBtn">Sign Out</button>
  </div>

  <!-- ── Login Screen ── -->
  <div id="tb-cms-login" role="main" aria-label="Estate CMS Login">
    <div class="tb-login-crest">
      <svg width="52" height="52" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <circle cx="24" cy="24" r="23" stroke="#C7A85E" stroke-opacity="0.4" stroke-width="1"/>
        <path d="M24 9C24 9 20.5 16.5 17.5 19.5C14.5 22.5 11.5 24.5 11.5 28.5C11.5 34.5 16.5 37.5 24 37.5C31.5 37.5 36.5 34.5 36.5 28.5C36.5 24.5 33.5 22.5 30.5 19.5C27.5 16.5 24 9 24 9Z" stroke="#C7A85E" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M24 13V33.5M24 21.5L19 24.5M24 25.5L29 28.5" stroke="#C7A85E" stroke-width="1" stroke-opacity="0.75" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="tb-login-estate-tag">Galaha · Old Ceylon · Est. 1890</div>
    <div class="tb-login-title">The Tea Bungalow</div>
    <div class="tb-login-sub">Estate Content Manager</div>

    <form class="tb-login-card" id="cmsLoginForm" autocomplete="off" novalidate>
      <label class="tb-login-label" for="cmsUsername">Username</label>
      <input
        class="tb-login-input"
        type="text"
        id="cmsUsername"
        name="username"
        placeholder="estate-admin"
        autocomplete="username"
        spellcheck="false"
      >

      <label class="tb-login-label" for="cmsPassword">Password</label>
      <input
        class="tb-login-input"
        type="password"
        id="cmsPassword"
        name="password"
        placeholder="••••••••••••••"
        autocomplete="current-password"
      >

      <button type="submit" class="tb-login-btn" id="cmsLoginBtn">
        Enter Estate Manager
      </button>

      <div class="tb-login-error" id="cmsLoginError" role="alert" aria-live="polite"></div>

      <div class="tb-login-rule"></div>
      <div class="tb-login-footer">
        Restricted access · The Tea Bungalow, Galaha Estate
      </div>
    </form>
  </div>

  <!-- Decap CMS (loaded only after successful auth) -->
  <script>
    // ── Credentials (SHA-256 hashed) ──────────────────────────────────────
    // Username: estate-admin
    // Password: TeaBungalow@2026
    // Hash generated via: crypto.subtle.digest('SHA-256', encoder.encode(pass))
    const VALID_USER = 'estate-admin';
    const VALID_PASS_HASH = 'ca36b6e3952776bb8a4bca121435e25de19981043cb93cd78a7ec59d8d815fc1';
    // SHA-256 of 'TeaBungalow@2026' — computed via Node crypto

    const SESSION_KEY = 'tb_cms_auth';
    const loginScreen = document.getElementById('tb-cms-login');
    const brandBar    = document.getElementById('cms-brand-bar');
    const loginForm   = document.getElementById('cmsLoginForm');
    const loginError  = document.getElementById('cmsLoginError');
    const logoutBtn   = document.getElementById('cmsLogoutBtn');

    // ── Hash helper using Web Crypto API ────────────────────────────────
    async function sha256(str) {
      const buf = await crypto.subtle.digest(
        'SHA-256',
        new TextEncoder().encode(str)
      );
      return Array.from(new Uint8Array(buf))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
    }

    // ── Check existing session ───────────────────────────────────────────
    function isAuthenticated() {
      try { return sessionStorage.getItem(SESSION_KEY) === 'granted'; } catch(e) { return false; }
    }

    function showCMS() {
      loginScreen.style.display = 'none';
      brandBar.classList.add('visible');
      if (!window.__cmsLoaded) {
        window.__cmsLoaded = true;
        loadCMS();
      }
    }

    function logout() {
      try { sessionStorage.removeItem(SESSION_KEY); } catch(e) {}
      location.reload();
    }

    // ── Login form submission ────────────────────────────────────────────
    loginForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      const username = document.getElementById('cmsUsername').value.trim();
      const password = document.getElementById('cmsPassword').value;

      loginError.textContent = '';
      loginError.classList.remove('visible');

      // Hash the entered password and compare
      const enteredHash = await sha256(password);

      if (username === VALID_USER && enteredHash === VALID_PASS_HASH) {
        try { sessionStorage.setItem(SESSION_KEY, 'granted'); } catch(e) {}
        showCMS();
      } else {
        loginError.textContent = 'Incorrect username or password. Please try again.';
        loginError.classList.add('visible');
        document.getElementById('cmsPassword').value = '';
        document.getElementById('cmsPassword').focus();
      }
    });

    // Allow pressing Enter to submit
    document.getElementById('cmsPassword').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') loginForm.requestSubmit();
    });

    // ── Logout ───────────────────────────────────────────────────────────
    logoutBtn.addEventListener('click', logout);

    // ── Auto-login if session already active ────────────────────────────
    if (isAuthenticated()) {
      showCMS();
    }

    // ── CMS Loader (called only after auth) ──────────────────────────────
    function loadCMS() {
      window.CMS_MANUAL_INIT = true;

      var script = document.createElement('script');
      script.src = 'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js';
      script.onload = function() {
        CMS.init({
          config: {
            backend: { name: 'test-repo' },
            media_folder: 'images/cms',
            public_folder: '/images/cms',
            site_url: 'https://www.theteabungalow.com',
            display_url: 'https://www.theteabungalow.com',
            logo_url: '/images/favicon.png',
            collections: [
              {
                name: 'experiences', label: 'Experiences',
                label_singular: 'Experience',
                folder: 'data/experiences', create: true, delete: true,
                slug: '{{slug}}', extension: 'json', format: 'json',
                summary: '{{title}} — {{category}}',
                fields: [
                  { label: 'Experience Title', name: 'title', widget: 'string' },
                  { label: 'Category', name: 'category', widget: 'select',
                    options: ['pekoe-trail','tea-estate','nature-wildlife','colonial-heritage','dining','wellness'] },
                  { label: 'Short Description', name: 'description', widget: 'text' },
                  { label: 'Duration', name: 'duration', widget: 'string' },
                  { label: 'Availability', name: 'availability', widget: 'select',
                    options: ['year-round','seasonal-oct-apr','on-request'] },
                  { label: 'Featured on Homepage?', name: 'featured', widget: 'boolean', default: false },
                  { label: 'Icon (Emoji)', name: 'icon', widget: 'string', required: false },
                  { label: 'Card Image', name: 'image', widget: 'image', required: false }
                ]
              },
              {
                name: 'packages', label: 'Packages & Offers',
                label_singular: 'Package',
                folder: 'data/packages', create: true, delete: true,
                slug: '{{slug}}', extension: 'json', format: 'json',
                summary: '{{name}} — {{nights}} Night(s)',
                fields: [
                  { label: 'Package Name', name: 'name', widget: 'string' },
                  { label: 'Tagline', name: 'tagline', widget: 'string' },
                  { label: 'Number of Nights', name: 'nights', widget: 'number', value_type: 'int', min: 1, max: 14 },
                  { label: 'Category', name: 'category', widget: 'select',
                    options: ['pekoe-trail','romantic','family','wellness','group','dining'] },
                  { label: 'Featured / Gold Card?', name: 'featured', widget: 'boolean', default: false },
                  { label: 'Popular Badge Label', name: 'badge', widget: 'string', required: false },
                  { label: 'Rate Display', name: 'rate', widget: 'string' },
                  { label: 'Rate Period', name: 'rate_period', widget: 'string', required: false },
                  { label: 'Package Inclusions', name: 'inclusions', widget: 'list',
                    field: { label: 'Inclusion', name: 'inclusion', widget: 'string' } },
                  { label: 'Active / Visible?', name: 'active', widget: 'boolean', default: true }
                ]
              },
              {
                name: 'journal', label: 'Journal & Stories',
                label_singular: 'Story',
                folder: 'data/journal', create: true, delete: true,
                slug: '{{slug}}', extension: 'json', format: 'json',
                summary: '{{title}} — {{category}} ({{date}})',
                fields: [
                  { label: 'Story Title', name: 'title', widget: 'string' },
                  { label: 'Subtitle / Tagline', name: 'tagline', widget: 'string', required: false },
                  { label: 'Slug / URL Identifier', name: 'slug', widget: 'string' },
                  { label: 'Publication Date', name: 'date', widget: 'datetime',
                    format: 'YYYY-MM-DD', date_format: 'DD MMM YYYY', time_format: false },
                  { label: 'Author / Voice', name: 'author', widget: 'string', default: 'Estate Historian' },
                  { label: 'Category', name: 'category', widget: 'select',
                    options: ['tea-heritage','pekoe-trail','estate-life','flora-fauna','culinary'] },
                  { label: 'Estimated Reading Time', name: 'read_time', widget: 'string', default: '5 min read' },
                  { label: 'Featured Image', name: 'featured_image', widget: 'image', required: false },
                  { label: 'Image Caption', name: 'image_caption', widget: 'string', required: false },
                  { label: 'Excerpt / Summary', name: 'excerpt', widget: 'text' },
                  { label: 'Story Body', name: 'body', widget: 'markdown' },
                  { label: 'Featured on Homepage?', name: 'featured', widget: 'boolean', default: false },
                  { label: 'Published?', name: 'published', widget: 'boolean', default: true }
                ]
              },
              {
                name: 'estate_announcements', label: 'Estate Announcements',
                label_singular: 'Announcement',
                folder: 'data/announcements', create: true, delete: true,
                slug: '{{year}}-{{month}}-{{day}}-{{slug}}',
                extension: 'json', format: 'json',
                summary: '{{title}} [{{type}}]',
                fields: [
                  { label: 'Announcement Title', name: 'title', widget: 'string' },
                  { label: 'Type', name: 'type', widget: 'select',
                    options: ['trail','weather','dining','notice','offer'] },
                  { label: 'Body', name: 'body', widget: 'text' },
                  { label: 'Date', name: 'date', widget: 'datetime',
                    format: 'YYYY-MM-DD', date_format: 'DD MMM YYYY', time_format: false },
                  { label: 'Active / Pinned?', name: 'active', widget: 'boolean', default: true },
                  { label: 'Expiry Date (optional)', name: 'expiry', widget: 'datetime',
                    format: 'YYYY-MM-DD', date_format: 'DD MMM YYYY', time_format: false, required: false }
                ]
              },
              {
                name: 'chambers', label: 'Chambers',
                label_singular: 'Chamber',
                folder: 'data/chambers', create: false, delete: false,
                extension: 'json', format: 'json',
                summary: '{{name}} — {{rate_display}}',
                fields: [
                  { label: 'Chamber Name', name: 'name', widget: 'string' },
                  { label: 'Rate Display', name: 'rate_display', widget: 'string' },
                  { label: 'Minimum Stay (nights)', name: 'min_stay', widget: 'number',
                    value_type: 'int', min: 1, max: 7, default: 1 },
                  { label: 'Seasonal Note', name: 'seasonal_note', widget: 'text', required: false },
                  { label: 'Availability Note', name: 'availability_note', widget: 'string', required: false },
                  { label: 'Visible on Chambers Page?', name: 'active', widget: 'boolean', default: true }
                ]
              },
              {
                name: 'gallery', label: 'Gallery Captions',
                label_singular: 'Gallery Image',
                folder: 'data/gallery', create: true, delete: true,
                slug: '{{slug}}', extension: 'json', format: 'json',
                summary: '{{caption}} ({{category}})',
                fields: [
                  { label: 'Image File', name: 'image', widget: 'image' },
                  { label: 'Caption', name: 'caption', widget: 'string' },
                  { label: 'Alt Text', name: 'alt', widget: 'string' },
                  { label: 'Category', name: 'category', widget: 'select',
                    options: ['estate','chambers','pekoe-trail','experiences','dining','landscape'] },
                  { label: 'Featured in Slideshow?', name: 'featured', widget: 'boolean', default: false },
                  { label: 'Sort Order', name: 'sort_order', widget: 'number',
                    value_type: 'int', min: 1, required: false }
                ]
              }
            ]
          }
        });
      };
      document.body.appendChild(script);
    }
  </script>

</body>
</html>
