<!-- ═══════════════════════════════════════════════════════════════════════════
     PRELOADER — "Dawn over Galaha"  (injected after <body> on every page by
     scripts/build_static.js; plays once per browser session)

     1. Pre-dawn  — letterbox bars slide in; tea-hill ridges with silver-oak shade
                    trees rise out of the dark, mist drifts, the sun crests the ridge.
     2. Ayubowan  — the traditional Sri Lankan greeting as a title card.
     3. Brand     — "two leaves and a bud" draws in gold, THE TEA BUNGALOW rises
                    letter by letter and catches the light.
     4. Open      — a gold tea-leaf outline draws at centre and opens out past the
                    screen edges onto the page.

     ~3.8s. Click / tap / Esc skips. Reduced-motion visitors never see it; the
     head script (build_static.js) hides it before first paint once seen.
═══════════════════════════════════════════════════════════════════════════ -->
<style>

  html.tb-pl-lock, html.tb-pl-lock body { overflow: hidden !important; }

  #tb-preloader {

    --tb-gold: #C7A85E;
    --tb-gold-light: #dfc080;

  @keyframes tbPlFailsafe { 0%, 96% { opacity: 1; visibility: visible; } 100% { opacity: 0; visibility: hidden; } }

      84vw 12vh rgba(245,241,233,.7), 92vw 30vh rgba(245,241,233,.45), 15vw 34vh rgba(245,241,233,.35),

  /* ── Mist, birds, grain, vignette ───────────────────────────────────── */
  .tb-pl-mist {

  .tb-pl-mist-2 { top: 63%; height: 20vh; }

  @keyframes tbPlBirds {

  }

  .tb-pl-grain {

  }
  @keyframes tbPlGrain {
    0% { transform: translate(0, 0); } 25% { transform: translate(-3%, 2%); }

  }
  .tb-pl-vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 90% at 50% 45%, transparent 45%, rgba(0, 0, 0, 0.55) 100%); }

  /* ── Title stage ─────────────────────────────────────────────────────── */
  .tb-pl-stage {
    position: absolute; left: 0; right: 0; top: 40%; transform: translateY(-50%);
    display: grid; place-items: center; text-align: center; padding: 0 20px;
  }

    opacity: 0; filter: blur(6px); transform: translateY(-54%) scale(0.97);
    transition: opacity 0.35s cubic-bezier(0.4, 0, 1, 1), filter 0.35s ease, transform 0.35s ease;
  }
  .tb-pl-greet, .tb-pl-brand { grid-area: 1 / 1; }

  .tb-pl-greet-si {
    font-family: 'Noto Serif Sinhala', 'Iskoola Pota', 'Sinhala Sangam MN', 'Noto Sans Sinhala', 'Nirmala UI', serif;
    font-size: clamp(38px, 7.2vw, 78px); font-weight: 400; line-height: 1.35;
    background: linear-gradient(180deg, #f3dca4 0%, var(--tb-gold-light) 45%, var(--tb-gold) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 6px 26px rgba(199, 168, 94, 0.25));
    opacity: 0; transform: translateY(16px); transition: opacity 0.8s ease, transform 1s var(--tb-ease);
  }
  .tb-pl-greet-en {
    margin-top: 6px; font-family: 'EB Garamond', Georgia, serif; font-style: italic;
    font-size: clamp(13px, 1.4vw, 16px); letter-spacing: 0.14em; color: rgba(245, 241, 233, 0.62);
    opacity: 0; transform: translateY(8px); transition: opacity 0.8s ease 0.15s, transform 1s var(--tb-ease) 0.15s;

  .tb-pl-bud { display: block; width: clamp(40px, 4.6vw, 56px); height: auto; margin: 0 auto 16px; overflow: visible; filter: drop-shadow(0 0 10px rgba(223, 192, 128, 0.35)); }

  #tb-preloader.is-brand .tb-pl-bud path { stroke-dashoffset: 0; transition: stroke-dashoffset 0.8s cubic-bezier(0.65, 0, 0.35, 1) var(--d, 0s), fill 0.7s ease calc(var(--d, 0s) + 0.6s); }

  .tb-pl-word {

    line-height: 1.2; letter-spacing: 0.2em; padding-left: 0.2em; color: var(--tb-cream);
  }
  .tb-pl-l { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: 0.08em; }
  .tb-pl-l > span { display: inline-block; transform: translateY(112%); }

  .tb-pl-sp { display: inline-block; width: 0.42em; }
  /* Light sweep through the letters only. The script measures the word (--tb-w) and each
     letter's offset in it (--tb-x) so every letter shows its slice of one shared gradient. */
  @supports ((-webkit-background-clip: text) or (background-clip: text)) {
    .tb-pl-l > span {
      background-image: linear-gradient(100deg, #efe8d8 0%, #efe8d8 42%, #e9c98a 46.5%, #ffffff 50%, #e9c98a 53.5%, #efe8d8 58%, #efe8d8 100%);

      background-position: calc(var(--tb-w, 600px) * -1.7 - var(--tb-x, 0px)) 0;
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    #tb-preloader.is-brand .tb-pl-l > span { animation: tbPlSweep 1.15s cubic-bezier(0.45, 0, 0.2, 1) 0.9s both; }
    @keyframes tbPlSweep {
      from { background-position: calc(var(--tb-w, 600px) * -1.7 - var(--tb-x, 0px)) 0; }
      to { background-position: calc(var(--tb-w, 600px) * -0.3 - var(--tb-x, 0px)) 0; }
    }
  }

  .tb-pl-tag { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 14px; }
  .tb-pl-rule { display: block; width: clamp(26px, 6vw, 72px); height: 1px; transform: scaleX(0); }

  /* ── Letterbox bars ─────────────────────────────────────────────────── */
  .tb-pl-bar {

    color: rgba(199, 168, 94, 0.72); white-space: nowrap; transition: transform 0.7s var(--tb-ease);

  .tb-pl-bar-top { top: 0; transform: translateY(-100%); }
  .tb-pl-bar-bottom { bottom: 0; transform: translateY(100%); }
  #tb-preloader.is-on .tb-pl-bar { transform: none; }
  #tb-preloader.is-exit .tb-pl-bar-top { transform: translateY(-100%); transition-duration: 0.5s; }

  .tb-pl-dim { color: rgba(245, 241, 233, 0.38); }

  .tb-pl-skip {

    color: rgba(245, 241, 233, 0.45); transition: color 0.25s ease;
  }
  .tb-pl-skip:hover { color: var(--tb-cream); }
  @media (max-width: 640px) { .tb-pl-hide-sm { display: none; } }

  /* ── Exit window (sits above the veil so its outline isn't clipped) ── */
  .tb-pl-window { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; filter: drop-shadow(0 0 7px rgba(223, 192, 128, 0.55)); }
  .tb-pl-edge { fill: none; stroke: var(--tb-gold-light); stroke-width: 1.6; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
  .tb-pl-cover { fill: #07130E; opacity: 0; }
  .tb-pl-window.is-drawn .tb-pl-edge { stroke-dashoffset: 0; transition: stroke-dashoffset 0.32s cubic-bezier(0.65, 0, 0.35, 1); }
  .tb-pl-window.is-drawn .tb-pl-cover { opacity: 0.94; transition: opacity 0.32s ease; }
  .tb-pl-window.is-lit .tb-pl-cover { opacity: 0; transition: opacity 0.26s ease-out; }
</style>

          <span class="tb-pl-l"><span style="--i:0">T</span></span><span class="tb-pl-l"><span style="--i:1">H</span></span><span class="tb-pl-l"><span style="--i:2">E</span></span><span class="tb-pl-sp"></span><span class="tb-pl-l"><span style="--i:3">T</span></span><span class="tb-pl-l"><span style="--i:4">E</span></span><span class="tb-pl-l"><span style="--i:5">A</span></span><span class="tb-pl-sp"></span><span class="tb-pl-l"><span style="--i:6">B</span></span><span class="tb-pl-l"><span style="--i:7">U</span></span><span class="tb-pl-l"><span style="--i:8">N</span></span><span class="tb-pl-l"><span style="--i:9">G</span></span><span class="tb-pl-l"><span style="--i:10">A</span></span><span class="tb-pl-l"><span style="--i:11">L</span></span><span class="tb-pl-l"><span style="--i:12">O</span></span><span class="tb-pl-l"><span style="--i:13">W</span></span>
        </div>
        <div class="tb-pl-tag">
          <span class="tb-pl-rule tb-pl-rule-l"></span>
          <span class="tb-pl-tag-text">Galaha &middot; Ceylon &middot; 1890</span>
          <span class="tb-pl-rule tb-pl-rule-r"></span>
        </div>
      </div>
    </div>

    <div class="tb-pl-bar tb-pl-bar-top">
      <span>The Tea Bungalow</span>
      <span class="tb-pl-dim">7.19&deg; N &middot; 80.66&deg; E</span>
    </div>
    <div class="tb-pl-bar tb-pl-bar-bottom">
      <span class="tb-pl-progress"></span>
      <span class="tb-pl-hide-sm">Galaha &middot; Central Province &middot; Sri Lanka</span>
      <button type="button" class="tb-pl-skip" tabindex="-1">Skip intro</button>
    </div>
  </div>

  <svg class="tb-pl-window" aria-hidden="true" focusable="false">
    <path class="tb-pl-cover" d=""/>
    <path class="tb-pl-edge" pathLength="1" d=""/>
  </svg>
</div>

<script>
  (function () {
    var preloader = document.getElementById('tb-preloader');
    if (!preloader) return;
    var root = document.documentElement;

    var forcePreview = false;
    try { forcePreview = /[?&]preview_preloader=1(&|$)/.test(window.location.search); } catch (e) {}
    var alreadySeen = false;
    try { alreadySeen = sessionStorage.getItem('tb_preloader_seen') === '1'; } catch (e) {}
    var reducedMotion = false;
    try { reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

    if ((alreadySeen && !forcePreview) || reducedMotion) {
      if (preloader.parentNode) preloader.parentNode.removeChild(preloader);
      return;
    }
    // ?preview_preloader=1 replays it even after the head script marked it as seen
    root.classList.remove('tb-preloader-skip');
    root.classList.add('tb-pl-lock');
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({ event: 'preloader_started' });

    // ---- Timeline (ms) ----
    var GREET_MS = 250, GREET_OUT_MS = 1000, BRAND_MS = 1100, EXIT_MS = 2450;
    var LOCKUP_OUT_MS = 180, OUTLINE_MS = 320, LIT_MS = 200, OPEN_MS = 850;

    var timers = [];
    var at = function (ms, fn) { timers.push(setTimeout(fn, ms)); };
    var phase = function (name) { preloader.classList.add(name); };
    var exiting = false, finished = false, completed = false;
    var inerted = [];

    var hardCap;

    function start() {
      // Restart the CSS failsafe from now (the page may have waited in a background tab);
      // the forced reflow also gives the transitions below their start state
      preloader.style.animation = 'none';
      void preloader.offsetWidth;
      preloader.style.animation = '';
      phase('is-on');
      at(GREET_MS, function () { phase('is-greet'); });
      at(GREET_OUT_MS, function () { phase('is-greet-out'); });
      at(BRAND_MS, function () {
        measureWord();
        phase('is-brand');
        window.dataLayer.push({ event: 'preloader_welcome_shown' });
      });
      at(BRAND_MS + 850, measureWord); // again just before the sweep, in case the webfont swapped in
      at(EXIT_MS, exit);
      hardCap = setTimeout(finish, 6500); // never hold the page longer than this
    }

    // Opened in a background tab: hold the intro until the guest actually looks at it
    if (document.hidden) {
      document.addEventListener('visibilitychange', function onVisible() {
        if (document.hidden) return;
        document.removeEventListener('visibilitychange', onVisible);
        start();
      });
    } else {
      start();
    }

    // Keep keyboard focus off the page underneath while the intro plays
    document.addEventListener('DOMContentLoaded', function () {
      if (finished) return;
      Array.prototype.forEach.call(document.body.children, function (el) {
        if (el !== preloader && el.tagName !== 'SCRIPT' && !el.inert) { el.inert = true; inerted.push(el); }
      });
    });

    preloader.addEventListener('click', exit);
    document.addEventListener('keydown', onKey);
    function onKey(e) { if (e.key === 'Escape') exit(); }

    // Positions for the light sweep: word width and each letter's offset within it
    function measureWord() {
      var word = preloader.querySelector('.tb-pl-word');
      if (!word) return;
      var left = word.getBoundingClientRect().left;
      word.style.setProperty('--tb-w', word.offsetWidth + 'px');
      Array.prototype.forEach.call(word.querySelectorAll('.tb-pl-l > span'), function (el) {
        el.style.setProperty('--tb-x', (el.getBoundingClientRect().left - left).toFixed(1) + 'px');
      });
    }

    function markComplete() {
      if (completed) return;
      completed = true;
      try { sessionStorage.setItem('tb_preloader_seen', '1'); } catch (e) {}
      window.dataLayer.push({ event: 'preloader_complete' });
    }

    // Tea leaf in unit space: tip up, widest point at the origin, tilted like a plucked leaf
    var LEAF = [[0, -1], [0.42, -0.62], [0.62, 0.05], [0, 1], [-0.62, 0.05], [-0.42, -0.62], [0, -1]];
    var TILT = -14 * Math.PI / 180, COS = Math.cos(TILT), SIN = Math.sin(TILT);
    function leafPath(cx, cy, s) {
      var p = LEAF.map(function (pt) {
        var x = pt[0], y = pt[1] + 0.21;
        return (cx + (x * COS - y * SIN) * s).toFixed(1) + ' ' + (cy + (x * SIN + y * COS) * s).toFixed(1);
      });
      return 'M' + p[0] + ' C' + p[1] + ' ' + p[2] + ' ' + p[3] + ' C' + p[4] + ' ' + p[5] + ' ' + p[6] + ' Z';
    }
    function easeInOutQuart(t) { return t < 0.5 ? 8 * t * t * t * t : 1 - Math.pow(-2 * t + 2, 4) / 2; }

    function exit() {
      if (exiting) return;
      exiting = true;
      timers.forEach(clearTimeout);
      phase('is-exit');
      var canCut = false;
      try { canCut = CSS.supports('clip-path', 'path(evenodd, "M0 0H1V1Z")'); } catch (e) {}
      if (!canCut) {
        phase('is-fade');
        markComplete();
        setTimeout(finish, 750);
        return;
      }
      setTimeout(openLeaf, LOCKUP_OUT_MS);
    }

    function openLeaf() {
      if (finished) return;
      var veil = preloader.querySelector('.tb-pl-veil');
      var win = preloader.querySelector('.tb-pl-window');
      var edge = preloader.querySelector('.tb-pl-edge');
      var cover = preloader.querySelector('.tb-pl-cover');
      var w = window.innerWidth, h = window.innerHeight, cx = w / 2, cy = h / 2;
      var s0 = Math.min(w, h) * 0.09;
      var s1 = Math.sqrt(w * w + h * h) * 1.45; // leaf's inner circle (~0.38s) clears every corner
      var cut = function (s) { return 'path(evenodd, "M0 0H' + w + 'V' + h + 'H0Z ' + leafPath(cx, cy, s) + '")'; };

      win.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
      edge.setAttribute('d', leafPath(cx, cy, s0));
      cover.setAttribute('d', leafPath(cx, cy, s0));
      win.getBoundingClientRect(); // commit the start state before transitioning
      win.classList.add('is-drawn');

      setTimeout(function () {
        if (finished) return;
        veil.style.clipPath = cut(s0);
        win.classList.add('is-lit');
        markComplete();
        setTimeout(function () {
          var start = null;
          var frame = function (now) {
            if (finished) return;
            if (start === null) start = now;
            var t = Math.min(1, (now - start) / OPEN_MS);
            var s = s0 + (s1 - s0) * easeInOutQuart(t);
            veil.style.clipPath = cut(s);
            edge.setAttribute('d', leafPath(cx, cy, s));
            edge.style.opacity = String(1 - Math.min(1, Math.max(0, (t - 0.3) / 0.45)));
            if (t < 1) requestAnimationFrame(frame); else finish();
          };
          requestAnimationFrame(frame);
          setTimeout(finish, OPEN_MS + 1200); // background tabs get no animation frames
        }, LIT_MS);
      }, OUTLINE_MS);
    }

    function finish() {
      if (finished) return;
      finished = true;
      clearTimeout(hardCap);
      timers.forEach(clearTimeout);
      markComplete();
      document.removeEventListener('keydown', onKey);
      root.classList.remove('tb-pl-lock');
      inerted.forEach(function (el) { el.inert = false; });
      if (preloader.parentNode) preloader.parentNode.removeChild(preloader);
      try { document.dispatchEvent(new CustomEvent('tb:preloader-done')); } catch (e) {}
    }
  })();
</script>
