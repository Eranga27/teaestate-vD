<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Estate CMS · The Tea Bungalow</title>
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <!-- Absolute path: with cleanUrls this page is served at /admin, where a relative config.yml would resolve to /config.yml -->
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url">
</head>
<body>
  <!-- Access control is GitHub sign-in (api/auth.js + api/callback.js): only accounts
       with write access to the repo can load or save content. -->
  <script>window.CMS_MANUAL_INIT = true;</script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Merged over config.yml. Running the login popup on this page's own origin keeps
    // the CMS working on whichever host it is opened from (preview now, production later).
    CMS.init({ config: { backend: { base_url: window.location.origin } } });
  </script>
</body>
</html>
